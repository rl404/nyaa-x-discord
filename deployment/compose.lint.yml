services:
  nxd-lint:
    container_name: nxd-lint
    image: golangci/golangci-lint:v2.15.0
    working_dir: /nyaa-x-discord
    command: make lint
    environment:
      - GOFLAGS=-mod=vendor
    volumes:
      - ../:/nyaa-x-discord:ro
      - go-mod-cache:/go/pkg/mod
    profiles:
      - lint

volumes:
  go-mod-cache:
